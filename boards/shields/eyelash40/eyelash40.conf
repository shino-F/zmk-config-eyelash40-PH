# ============================================================
# 无线性能优化
# ============================================================

# 提高蓝牙发射功率到 +4dBm，增强无线连接稳定性
CONFIG_BT_CTLR_TX_PWR_PLUS_4=y

# 增大堆内存池，给蓝牙和 Studio 留更多内存
CONFIG_HEAP_MEM_POOL_SIZE=32768

# 增大系统工作队列栈，避免高负载时栈溢出
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096

# 增大 ZMK Studio RPC 线程栈，保证 Studio 通信稳定
CONFIG_ZMK_STUDIO_RPC_THREAD_STACK_SIZE=8192

# ============================================================
# BLE 吞吐量优化（让 ZMK Studio over BLE 更快）
# ============================================================

# 蓝牙数据包最大长度，增大可提高吞吐量
CONFIG_BT_CTLR_DATA_LENGTH_MAX=251

# ACL 发送缓冲区大小
CONFIG_BT_BUF_ACL_TX_SIZE=251

# ACL 接收缓冲区大小
CONFIG_BT_BUF_ACL_RX_SIZE=251

# L2CAP 层最大传输单元，影响单次传输的数据量
CONFIG_BT_L2CAP_TX_MTU=247

# 自动协商更大的 MTU，提高 BLE 传输效率
CONFIG_BT_GATT_AUTO_UPDATE_MTU=y

# L2CAP 发送缓冲区数量，增大可减少丢包
CONFIG_BT_L2CAP_TX_BUF_COUNT=10

# Studio RPC 发送缓冲区大小
CONFIG_ZMK_STUDIO_RPC_TX_BUF_SIZE=256

# Studio RPC 接收缓冲区大小
CONFIG_ZMK_STUDIO_RPC_RX_BUF_SIZE=256

# ============================================================
# BLE 实验性功能
# ============================================================

# 启用 BLE 实验性功能（部分新特性需要）
CONFIG_ZMK_BLE_EXPERIMENTAL_FEATURES=y

# 启用配对码输入功能，配对时可在键盘上输入密码
CONFIG_ZMK_BLE_PASSKEY_ENTRY=y

# ============================================================
# 低功耗与休眠
# ============================================================

# 闲置 2 分钟后进入 idle（单位：毫秒）
CONFIG_ZMK_IDLE_TIMEOUT=120000

# 插着 USB 供电时不进入 idle，方便调试
CONFIG_ZMK_IDLE_SKIP_ON_USB_POWER=y

# 闲置 10 分钟后进入深度休眠（单位：毫秒）
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=600000

# 启用休眠功能，省电
CONFIG_ZMK_SLEEP=y

# ============================================================
# 电池报告
# ============================================================

# 电池电量上报间隔，单位秒（360 秒 = 6 分钟）
CONFIG_ZMK_BATTERY_REPORT_INTERVAL=360

# ============================================================
# NKRO（全键无冲，可选）
# ============================================================

# 启用 NKRO，支持全键无冲。如果不需要可删掉这行
CONFIG_ZMK_HID_REPORT_TYPE_NKRO=y

# ============================================================
# 鼠标行为
# ============================================================

# 启用鼠标按键和移动功能
CONFIG_ZMK_POINTING=y
